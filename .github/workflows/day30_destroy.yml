name: "Teardown Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to completely destroy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: "./day-30 - drift-detection/code"
        
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          
      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ github.event.inputs.environment }}.hcl
        
      - name: Break Ghost State Lock
        # 🌟 FORCE UNLOCK: Evicts the stale lock ID left behind by the canceled runner step
        run: terraform force-unlock -force 8b09124c-fd19-549c-39a1-c0287c7d5a11
        continue-on-error: true # Ensures dev teardown won't fail if dev doesn't have a stuck lock
        
      - name: Terraform Destroy
        run: terraform destroy -var="environment=${{ github.event.inputs.environment }}" -auto-approve
      
name: "Teardown Infrastructure"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to completely destroy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    
    # Ensures the runner drops directly into your Terraform source code directory
    defaults:
      run:
        working-directory: "./day-30 - drift-detection/code"
        
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          
      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ github.event.inputs.environment }}.hcl
        
      - name: Terraform Destroy
        # Removed the undeclared -var flag since state tracking handles resources natively
        run: terraform destroy -auto-approve
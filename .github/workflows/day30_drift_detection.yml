name: "Automated Drift Detection & Remediation"

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to evaluate'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
  repository_dispatch:
    types: [aws-drift-alert]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    defaults:
      run:
        working-directory: "./day-30 - drift-detection/code"

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Debug Directory Structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== REPOSITORY ROOT CONTENTS ==="
          ls -R

      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ env.TARGET_ENV }}.hcl

      - name: Core Drift Evaluation
        id: check_drift
        run: terraform plan -var="environment=${{ env.TARGET_ENV }}" -detailed-exitcode -out=tfplan

      - name: Open Tracking Auditing Issue
        if: steps.check_drift.outputs.exitcode == 2
        id: open_issue
        uses: imjohnbo/issue-bot@v3
        with:
          title: "[ALERT] Infrastructure Drift Detected - ${{ env.TARGET_ENV }}"
          body: "Unapproved manual alterations detected in the live cloud environment. Self-healing protocol initiated."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Auto-Remediation Execution
        if: steps.check_drift.outputs.exitcode == 2
        id: remediate
        run: terraform apply -auto-approve tfplan

      - name: Auto-Close Remediation Ticket
        if: always() && steps.check_drift.outputs.exitcode == 2
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 🌟 THE ULTIMATE GRAPHQL SOLUTION 🌟
            // Instantly grabs the absolute newest issue created in the repo, bypassing all caching/indexing lag
            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issues(last: 1) {
                    nodes {
                      number
                      title
                    }
                  }
                }
              }
            `;
            
            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo
            };
            
            const result = await github.graphql(query, variables);
            const latestIssue = result.repository.issues.nodes[0];
            
            if (!latestIssue) {
              console.log("CRITICAL: GraphQL engine returned an empty issue stream.");
              return;
            }
            
            const issueNumber = latestIssue.number;
            console.log(`GraphQL instantly matched live target: Issue #${issueNumber} ("${latestIssue.title}")`);
            
            // Append validation comment to audit trail
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "✅ **Auto-Remediation Successful**: The pipeline has successfully executed `terraform apply` to strip out unauthorized configuration drift. Moving this tracking ticket to completed."
            });
            
            // Close the ticket smoothly
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
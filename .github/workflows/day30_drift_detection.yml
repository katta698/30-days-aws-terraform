name: "Automated Drift Detection & Remediation"

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to evaluate'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
  repository_dispatch:
    types: [aws-drift-alert]

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: "./day-30 - drift-detection/code"

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Debug Directory Structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== REPOSITORY ROOT CONTENTS ==="
          ls -R

      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ env.TARGET_ENV }}.hcl

      - name: Core Drift Evaluation
        id: check_drift
        run: terraform plan -var="environment=${{ env.TARGET_ENV }}" -detailed-exitcode -out=tfplan

      - name: Open Tracking Auditing Issue
        if: steps.check_drift.outputs.exitcode == 2
        id: open_issue
        uses: imjohnbo/issue-bot@v3
        with:
          title: "[ALERT] Infrastructure Drift Detected - ${{ env.TARGET_ENV }}"
          body: "Unapproved manual alterations detected in the live cloud environment. Self-healing protocol initiated."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Auto-Remediation Execution
        if: steps.check_drift.outputs.exitcode == 2
        id: remediate
        run: terraform apply -auto-approve tfplan

      - name: Auto-Close Remediation Ticket
        if: always() && steps.check_drift.outputs.exitcode == 2
        # 🌟 FIXED: Restored the missing script runner pointer 🌟
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.open_issue.outputs.number }}
        # 🌟 FIXED: Aligned indentation blocks cleanly 🌟
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            if (!issueNumber) {
              console.log("No active tracking issue found to process.");
              return;
            }
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              state: 'closed',
              state_reason: 'completed'
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: "✅ **Auto-Remediation Successful**: Live environment has been returned to its desired Git baseline state. Closing ticket."
            });